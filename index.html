<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.webmanifest">
<title>Investfolio</title>
<style>
:root{--bg:#0b0d11;--panel:#141821;--panel2:#1b202a;--text:#f6f7f9;--muted:#949cab;--line:rgba(255,255,255,.08);--up:#ff453a;--down:#31d07f;--gold:#d7bf8a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}button,input,select{font:inherit}.wrap{max-width:540px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.16em;color:var(--gold);font-weight:700}.sync{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;padding:10px 12px}h1{font-size:34px;margin:8px 0 4px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px}.hero{margin-top:18px;background:linear-gradient(145deg,#171b24,#101319);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.hero .label{font-size:13px;color:var(--muted)}.hero .value{font-size:34px;font-weight:750;margin:8px 0 16px;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:rgba(255,255,255,.035);border-radius:18px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.metric strong{font-size:17px}.up{color:var(--up)!important}.down{color:var(--down)!important}.tabs{display:flex;gap:7px;margin:18px 0 12px;overflow:auto}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:12px}.tab.active{background:var(--panel2);color:var(--text)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.symbol{font-size:20px;font-weight:750}.name{font-size:12px;color:var(--muted);margin-top:2px}.price{font-weight:700;text-align:right}.mini{font-size:12px;color:var(--muted);margin-top:3px;text-align:right}.hold-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;border-top:1px solid var(--line);margin-top:13px;padding-top:13px}.hold-meta div span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.hold-meta div strong{font-size:13px}.empty{text-align:center;padding:34px 20px;color:var(--muted)}.fab{position:fixed;right:max(22px,calc((100vw - 540px)/2 + 22px));bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:#f4f2ed;color:#101216;font-size:30px;box-shadow:0 12px 35px rgba(0,0,0,.35)}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 0;font-size:11px}.nav button.active{color:var(--text)}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}.panel{width:100%;max-height:90vh;overflow:auto;background:#11151c;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.panelinner{max-width:540px;margin:0 auto}.drag{width:44px;height:5px;border-radius:5px;background:#3c4350;margin:0 auto 16px}label{font-size:12px;color:var(--muted);display:block;margin:12px 2px 6px}input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:14px;outline:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;margin-top:18px;border:0;background:#f3f0e8;color:#111;border-radius:16px;padding:14px;font-weight:750}.secondary{width:100%;margin-top:10px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:16px;padding:13px}.settings .card{padding:15px}.settings button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 0}.note{font-size:12px;color:var(--muted);line-height:1.6}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted)}
</style>
</head><body>
<div class="wrap" id="app"></div><button class="fab" id="fab">＋</button>
<div class="nav"><div class="navin"><button data-page="home" class="active">總覽</button><button data-page="holdings">持股</button><button data-page="activity">交易</button><button data-page="settings">設定</button></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="panelinner"><div class="drag"></div><div id="sheetContent"></div></div></div></div>
<script>
const STORAGE_KEY='investfolio_v1';
const state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"transactions":[],"brokers":[],"quotes":{},"settings":{"finmindToken":"","twelveKey":"","usdTwd":31.2}}');
state.transactions=state.transactions||[];state.brokers=state.brokers||[];state.quotes=state.quotes||{};state.settings=state.settings||{finmindToken:'',twelveKey:'',usdTwd:31.2};
let page='home',marketFilter='ALL';
const $=s=>document.querySelector(s),money=(n,c='TWD')=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:c,maximumFractionDigits:c==='TWD'?0:2}).format(Number(n||0));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function perfClass(n){return Number(n)>=0?'up':'down'}
function seedScreenshotPortfolio(){
 const broker='原券商（館前分公司）',batch='screenshot-20260821';
 const items=[
 ['0050','元大台灣50',7795,65.65,511918,104.65],['00919','群益台灣精選高息',2338,29.91,69945,30.8],['1101','台泥',1099,49.88,54821,24.85],['2317','鴻海',250,257.5,64399,245.5],['2330','台積電',20,1870,37414,2410],['2454','聯發科',35,3691.43,129249,3790],['3711','日月光投控',130,617.46,80300,587],['6207','雷科',300,124,37214,103.5],['6757','台灣虎航',1,54,55,55.8]
 ];
 if(!state.brokers.includes(broker))state.brokers.push(broker);
 for(const [symbol,name,qty,avg,cost,current] of items){
   const exists=state.transactions.some(t=>t.market==='TW'&&t.symbol===symbol);
   if(!exists){state.transactions.push({id:batch+'-'+symbol,importBatch:batch,market:'TW',type:'BUY',symbol,name,broker,date:'2026-08-21',qty,price:avg,fee:Number((cost-qty*avg).toFixed(2)),amount:0,fx:1});}
   const q=state.quotes['TW|'+symbol];if(!q||q.updated?.startsWith('2026-08-21'))state.quotes['TW|'+symbol]={price:current,updated:'2026-08-21T15:19:00+08:00'};
 }
 save();
}
seedScreenshotPortfolio();
function calc(){const map={},realized={TWD:0,USD:0},dividendsTwd={};const txs=[...state.transactions].sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));for(const t of txs){const k=[t.market,t.symbol,t.broker].join('|');if(!map[k])map[k]={market:t.market,symbol:t.symbol,name:t.name||'',broker:t.broker,qty:0,costTwd:0,costNative:0,currency:t.market==='TW'?'TWD':'USD'};const h=map[k],q=Number(t.qty||0),p=Number(t.price||0),fee=Number(t.fee||0),fx=t.market==='TW'?1:Number(t.fx||state.settings.usdTwd||1);if(t.type==='BUY'){h.qty+=q;h.costNative+=p*q+fee;h.costTwd+=(p*q+fee)*fx}else if(t.type==='SELL'&&h.qty>0){const avgTwd=h.costTwd/h.qty,avgNative=h.costNative/h.qty,sellQty=Math.min(q,h.qty),proceedsNative=p*sellQty-fee,proceedsTwd=proceedsNative*fx;realized.TWD+=proceedsTwd-avgTwd*sellQty;if(t.market==='US')realized.USD+=proceedsNative-avgNative*sellQty;h.qty-=sellQty;h.costTwd-=avgTwd*sellQty;h.costNative-=avgNative*sellQty}else if(t.type==='DIVIDEND'){const amt=Number(t.amount||0);dividendsTwd[k]=(dividendsTwd[k]||0)+amt*fx}}const holdings=Object.values(map).filter(h=>h.qty>1e-7).map(h=>{const quote=state.quotes[h.market+'|'+h.symbol]||{},current=Number(quote.price||0),fx=h.market==='TW'?1:Number(state.settings.usdTwd||1),valueNative=current*h.qty,valueTwd=valueNative*fx,pnlTwd=valueTwd-h.costTwd;return{...h,current,valueNative,valueTwd,pnlTwd,pnlPct:h.costTwd?pnlTwd/h.costTwd*100:0,avgNative:h.costNative/h.qty,avgTwd:h.costTwd/h.qty,updated:quote.updated||''}});return{holdings,realized,dividendsTwd:Object.values(dividendsTwd).reduce((a,b)=>a+b,0)}}
function totalMetrics(){const{holdings,realized,dividendsTwd}=calc(),cost=holdings.reduce((a,h)=>a+h.costTwd,0),value=holdings.reduce((a,h)=>a+h.valueTwd,0),pnl=value-cost;return{cost,value,pnl,pct:cost?pnl/cost*100:0,realized:realized.TWD,dividends:dividendsTwd}}
function render(){$('.nav button.active')?.classList.remove('active');$(`.nav button[data-page="${page}"]`)?.classList.add('active');$('#fab').style.display=page==='settings'?'none':'block';if(page==='home')renderHome();if(page==='holdings')renderHoldings();if(page==='activity')renderActivity();if(page==='settings')renderSettings()}
function holdingsCards(list){if(!list.length)return'<div class="card empty">還沒有持股。按右下角「＋」加入第一筆交易。</div>';return list.map(h=>`<div class="card"><div class="row"><div><div class="symbol">${esc(h.symbol)}</div><div class="name">${esc(h.name||'')} · ${esc(h.broker)}</div></div><div><div class="price">${h.current?money(h.current,h.currency):'尚未更新'}</div><div class="mini ${perfClass(h.pnlTwd)}">${h.pnlTwd>=0?'+':''}${money(h.pnlTwd)} · ${h.pnlPct>=0?'+':''}${h.pnlPct.toFixed(2)}%</div></div></div><div class="hold-meta"><div><span>持有</span><strong>${h.qty}</strong></div><div><span>平均成本</span><strong>${money(h.avgNative,h.currency)}</strong></div><div><span>市值</span><strong>${money(h.valueTwd)}</strong></div></div></div>`).join('')}
function renderHome(){const m=totalMetrics(),{holdings}=calc(),filt=holdings.filter(h=>marketFilter==='ALL'||h.market===marketFilter);$('#app').innerHTML=`<div class="top"><div class="brand">INVESTFOLIO</div><button class="sync" onclick="refreshQuotes()">↻ 更新</button></div><h1>我的投資</h1><div class="sub">${latestUpdate()}</div><div class="hero"><div class="label">目前股票市值</div><div class="value">${money(m.value)}</div><div class="grid"><div class="metric"><span>投入成本</span><strong>${money(m.cost)}</strong></div><div class="metric"><span>未實現損益</span><strong class="${perfClass(m.pnl)}">${m.pnl>=0?'+':''}${money(m.pnl)} · ${m.pct>=0?'+':''}${m.pct.toFixed(2)}%</strong></div><div class="metric"><span>已實現損益</span><strong class="${perfClass(m.realized)}">${m.realized>=0?'+':''}${money(m.realized)}</strong></div><div class="metric"><span>累計股息</span><strong>${money(m.dividends)}</strong></div></div></div><div class="tabs"><button class="tab ${marketFilter==='ALL'?'active':''}" onclick="marketFilter='ALL';render()">全部</button><button class="tab ${marketFilter==='TW'?'active':''}" onclick="marketFilter='TW';render()">🇹🇼 台股</button><button class="tab ${marketFilter==='US'?'active':''}" onclick="marketFilter='US';render()">🇺🇸 美股</button></div><div class="section-title"><h2>持股</h2><small>${filt.length} 個部位</small></div>${holdingsCards(filt)}`}
function renderHoldings(){const{holdings}=calc();$('#app').innerHTML=`<div class="top"><div class="brand">INVESTFOLIO</div><button class="sync" onclick="refreshQuotes()">↻ 更新</button></div><h1>持股</h1><div class="sub">紅色＝上漲／獲利，綠色＝下跌／虧損</div><div style="height:12px"></div>${holdingsCards(holdings)}`}
function renderActivity(){const tx=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));$('#app').innerHTML=`<div class="top"><div class="brand">INVESTFOLIO</div></div><h1>交易紀錄</h1><div class="sub">${tx.length} 筆</div><div style="height:14px"></div>`+(tx.length?tx.map(t=>`<div class="card"><div class="row"><div><div class="symbol">${esc(t.symbol)}</div><div class="name">${esc(t.date)} · ${esc(t.broker)}</div></div><div style="text-align:right"><span class="pill">${t.type==='BUY'?'買進':t.type==='SELL'?'賣出':'股息'}</span><div class="mini">${t.type==='DIVIDEND'?money(t.amount,t.market==='TW'?'TWD':'USD'):`${t.qty} × ${money(t.price,t.market==='TW'?'TWD':'USD')}`}</div></div></div></div>`).join(''):'<div class="card empty">尚無交易紀錄</div>')}
function renderSettings(){$('#app').innerHTML=`<div class="top"><div class="brand">INVESTFOLIO</div></div><h1>設定</h1><div class="sub">行情金鑰只儲存在這台裝置。</div><div class="settings"><div class="card"><label>FinMind Token（台股）</label><input id="finmind" value="${esc(state.settings.finmindToken||'')}" placeholder="可先留空"><label>Twelve Data API Key（美股）</label><input id="twelve" value="${esc(state.settings.twelveKey||'')}" placeholder="可先留空"><label>目前 USD/TWD</label><input id="fx" type="number" step="0.0001" value="${Number(state.settings.usdTwd||31.2)}"><button class="primary" onclick="saveSettings()">儲存設定</button><p class="note">台股更新走 FinMind；美股走 Twelve Data。沒有 API Key 時仍可使用目前已儲存的價格與成本資料。</p></div><div class="card"><button onclick="exportData()">匯出備份 JSON</button><hr><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"><hr><button onclick="showBrokerSheet()">管理券商</button></div></div>`}
function latestUpdate(){const times=Object.values(state.quotes).map(q=>q.updated).filter(Boolean).sort();return times.length?'行情更新：'+new Date(times.at(-1)).toLocaleString('zh-TW'):'尚未取得行情'}
function showTxSheet(){const brokerOpts=state.brokers.length?state.brokers.map(b=>`<option>${esc(b)}</option>`).join(''):'<option>自訂券商</option>';$('#sheetContent').innerHTML=`<h2>新增交易</h2><div class="formgrid"><div><label>市場</label><select id="mkt" onchange="toggleFx()"><option value="TW">台股</option><option value="US">美股</option></select></div><div><label>類型</label><select id="typ" onchange="toggleDividend()"><option value="BUY">買進</option><option value="SELL">賣出</option><option value="DIVIDEND">股息</option></select></div></div><label>券商</label><select id="broker">${brokerOpts}</select><input id="brokerCustom" placeholder="若要新增券商，可直接輸入" style="margin-top:7px"><div class="formgrid"><div><label>代號</label><input id="symbol" placeholder="0050 / AAPL"></div><div><label>名稱</label><input id="name" placeholder="可選填"></div></div><div id="tradeFields"><div class="formgrid"><div><label>股數</label><input id="qty" type="number" step="0.000001"></div><div><label>成交價</label><input id="price" type="number" step="0.0001"></div></div><label>手續費 / 費用</label><input id="fee" type="number" step="0.0001" value="0"></div><div id="divField" style="display:none"><label>實收股息</label><input id="amount" type="number" step="0.01"></div><div id="fxField" style="display:none"><label>交易當時 USD/TWD 匯率</label><input id="tradeFx" type="number" step="0.0001" value="${Number(state.settings.usdTwd||31.2)}"></div><label>日期</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="primary" onclick="addTransaction()">儲存交易</button><button class="secondary" onclick="closeSheet()">取消</button>`;$('#sheet').classList.add('show')}
function toggleFx(){$('#fxField').style.display=$('#mkt').value==='US'?'block':'none'}function toggleDividend(){const d=$('#typ').value==='DIVIDEND';$('#tradeFields').style.display=d?'none':'block';$('#divField').style.display=d?'block':'none'}
function addTransaction(){const market=$('#mkt').value,type=$('#typ').value,symbol=$('#symbol').value.trim().toUpperCase(),name=$('#name').value.trim(),broker=($('#brokerCustom').value.trim()||$('#broker').value).trim(),date=$('#date').value;if(!symbol||!broker||!date){alert('請至少填寫代號、券商與日期');return}const t={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),market,type,symbol,name,broker,date,qty:Number($('#qty')?.value||0),price:Number($('#price')?.value||0),fee:Number($('#fee')?.value||0),amount:Number($('#amount')?.value||0),fx:market==='TW'?1:Number($('#tradeFx')?.value||state.settings.usdTwd||1)};if(type!=='DIVIDEND'&&(!t.qty||!t.price)){alert('請填寫股數與成交價');return}if(type==='DIVIDEND'&&!t.amount){alert('請填寫股息金額');return}if(!state.brokers.includes(broker))state.brokers.push(broker);state.transactions.push(t);save();closeSheet();render()}
function showBrokerSheet(){$('#sheetContent').innerHTML=`<h2>管理券商</h2><p class="note">目前：${state.brokers.map(esc).join('、')||'尚未建立'}</p><label>新增券商</label><input id="newBroker" placeholder="例如：永豐、富邦、Schwab"><button class="primary" onclick="addBroker()">加入</button><button class="secondary" onclick="closeSheet()">完成</button>`;$('#sheet').classList.add('show')}function addBroker(){const b=$('#newBroker').value.trim();if(b&&!state.brokers.includes(b)){state.brokers.push(b);save();showBrokerSheet()}}function closeSheet(){$('#sheet').classList.remove('show')}function saveSettings(){state.settings.finmindToken=$('#finmind').value.trim();state.settings.twelveKey=$('#twelve').value.trim();state.settings.usdTwd=Number($('#fx').value||state.settings.usdTwd||1);save();alert('已儲存');render()}
async function refreshQuotes(){const{holdings}=calc();if(!holdings.length){alert('請先新增持股');return}let ok=0,fail=0;for(const h of holdings){try{let price=0;if(h.market==='TW'){if(!state.settings.finmindToken)throw new Error('缺少 FinMind Token');const u=`https://api.finmindtrade.com/api/v4/taiwan_stock_tick_snapshot?data_id=${encodeURIComponent(h.symbol)}&token=${encodeURIComponent(state.settings.finmindToken)}`,r=await fetch(u),j=await r.json(),d=(j.data||[])[0]||{};price=Number(d.close||d.price||d.last_price||d.lastPrice||0)}else{if(!state.settings.twelveKey)throw new Error('缺少 Twelve Data Key');const u=`https://api.twelvedata.com/price?symbol=${encodeURIComponent(h.symbol)}&apikey=${encodeURIComponent(state.settings.twelveKey)}`,r=await fetch(u),j=await r.json();price=Number(j.price||0)}if(!price)throw new Error('無價格');state.quotes[h.market+'|'+h.symbol]={price,updated:new Date().toISOString()};ok++}catch(e){console.warn(h.symbol,e);fail++}}save();render();alert(`更新完成：${ok} 檔成功${fail?`，${fail} 檔失敗`:''}`)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='investfolio-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);localStorage.setItem(STORAGE_KEY,JSON.stringify(j));location.reload()}catch(e){alert('備份檔格式錯誤')}};r.readAsText(file)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#fab').onclick=showTxSheet;$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
