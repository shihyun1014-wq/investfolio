<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d11"><link rel="manifest" href="manifest.webmanifest"><title>Investfolio</title><style>:root{--bg:#0b0d11;--panel:#141821;--panel2:#1b202a;--text:#f6f7f9;--muted:#949cab;--line:rgba(255,255,255,.08);--up:#ff453a;--down:#31d07f;--gold:#d7bf8a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}body{min-height:100vh;padding-bottom:100px}button,input,select{font:inherit}.wrap{max-width:540px;margin:auto;padding:28px 18px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:13px;letter-spacing:.16em;color:var(--gold);font-weight:700}.sync{border:1px solid var(--line);background:#171b24;color:var(--text);border-radius:14px;padding:10px 12px}h1{font-size:34px;margin:16px 0 4px}.sub,.name,.mini{color:var(--muted);font-size:12px}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px}.hero{margin-top:18px;padding:22px}.hero .label{font-size:13px;color:var(--muted)}.hero .value{font-size:34px;font-weight:750;margin:8px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:rgba(255,255,255,.035);border-radius:18px;padding:14px}.metric span,.hold-meta span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.up{color:var(--up)!important}.down{color:var(--down)!important}.tabs{display:flex;gap:7px;margin:18px 0 12px;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:12px;white-space:nowrap}.tab.active{background:var(--panel2);color:var(--text)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}.card{padding:16px;margin-bottom:10px}.symbol{font-size:20px;font-weight:750}.price{font-weight:700;text-align:right}.mini{text-align:right;margin-top:3px}.hold-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;border-top:1px solid var(--line);margin-top:13px;padding-top:13px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,20,.94);border-top:1px solid var(--line);padding:10px 12px 20px;display:flex;justify-content:center}.navin{width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted);padding:8px}.nav button.active{color:var(--text)}.fab{position:fixed;right:22px;bottom:92px;width:58px;height:58px;border-radius:50%;border:0;font-size:30px}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}.panel{width:100%;background:#11151c;border-radius:28px 28px 0 0;padding:22px 18px 30px;max-height:90vh;overflow:auto}.panelinner{max-width:540px;margin:auto}label{font-size:12px;color:var(--muted);display:block;margin:12px 2px 6px}input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{width:100%;margin-top:12px;border-radius:16px;padding:14px}.primary{border:0}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}</style></head><body><div class="wrap" id="app"></div><button class="fab" id="fab">＋</button><div class="nav"><div class="navin"><button data-page="home" class="active">總覽</button><button data-page="holdings">持股</button><button data-page="activity">交易</button><button data-page="settings">設定</button></div></div><div class="sheet" id="sheet"><div class="panel"><div class="panelinner" id="sheetContent"></div></div></div><script>const K='investfolio_v1',state=JSON.parse(localStorage.getItem(K)||'{"transactions":[],"brokers":[],"quotes":{},"settings":{"finmindToken":"","twelveKey":"","usdTwd":31.2}}');state.transactions||=[];state.brokers||=[];state.quotes||={};state.settings||={usdTwd:31.2};let page='home',marketFilter='ALL';const $=s=>document.querySelector(s),money=(n,c='TWD')=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:c,maximumFractionDigits:c==='TWD'?0:2}).format(+n||0),save=()=>localStorage.setItem(K,JSON.stringify(state)),pc=n=>+n>=0?'up':'down';function addSeed(broker,market,items,prefix,fx=1){if(!state.brokers.includes(broker))state.brokers.push(broker);for(const[symbol,name,qty,avg,current]of items){if(!state.transactions.some(t=>t.market===market&&t.symbol===symbol&&t.broker===broker))state.transactions.push({id:prefix+symbol,market,type:'BUY',symbol,name,broker,date:'2026-08-22',qty,price:avg,fee:0,fx});state.quotes[market+'|'+symbol]={price:current,updated:'2026-08-22T15:36:00+08:00'}}}function seed(){addSeed('富邦證券（複委託）','US',[['NVDA','輝達',1,203.44,214.72],['UBER','優步',1,72.89,78.60]],'fubon-',31.872);addSeed('永豐證券（複委託）','US',[['AAPL','蘋果',2,137.27,309.35],['DIS','華特迪士尼',3,198.87,107.78],['NVDA','輝達',1,202.20,214.72],['QQQM','Invesco NASDAQ 100 ETF',2,296.44,293.76]],'sinopac-',+state.settings.usdTwd||31.2);save()}seed();function calc(){const map={};for(const t of state.transactions){const k=[t.market,t.symbol,t.broker].join('|');if(!map[k])map[k]={market:t.market,symbol:t.symbol,name:t.name||'',broker:t.broker,qty:0,costTwd:0,costNative:0,currency:t.market==='TW'?'TWD':'USD'};const h=map[k],q=+t.qty||0,p=+t.price||0,fee=+t.fee||0,fx=t.market==='TW'?1:+t.fx||+state.settings.usdTwd||1;if(t.type==='BUY'){h.qty+=q;h.costNative+=p*q+fee;h.costTwd+=(p*q+fee)*fx}}const holdings=Object.values(map).filter(h=>h.qty>0).map(h=>{const current=+(state.quotes[h.market+'|'+h.symbol]?.price)||0,fx=h.market==='TW'?1:+state.settings.usdTwd||1,valueNative=current*h.qty,valueTwd=valueNative*fx,pnlTwd=valueTwd-h.costTwd;return{...h,current,valueTwd,pnlTwd,pnlPct:h.costTwd?pnlTwd/h.costTwd*100:0,avgNative:h.costNative/h.qty}});return holdings}function metrics(){const h=calc(),cost=h.reduce((a,x)=>a+x.costTwd,0),value=h.reduce((a,x)=>a+x.valueTwd,0),pnl=value-cost;return{cost,value,pnl,pct:cost?pnl/cost*100:0}}function cards(h){return h.map(x=>`<div class="card"><div class="row"><div><div class="symbol">${x.symbol}</div><div class="name">${x.name} · ${x.broker}</div></div><div><div class="price">${x.current?money(x.current,x.currency):'尚未更新'}</div><div class="mini ${pc(x.pnlTwd)}">${x.pnlTwd>=0?'+':''}${money(x.pnlTwd)} · ${x.pnlPct>=0?'+':''}${x.pnlPct.toFixed(2)}%</div></div></div><div class="hold-meta"><div><span>持有</span><strong>${x.qty}</strong></div><div><span>平均成本</span><strong>${money(x.avgNative,x.currency)}</strong></div><div><span>市值</span><strong>${money(x.valueTwd)}</strong></div></div></div>`).join('')}function renderHome(){const m=metrics(),h=calc().filter(x=>marketFilter==='ALL'||x.market===marketFilter);$('#app').innerHTML=`<div class="top"><div class="brand">INVESTFOLIO</div><button class="sync" onclick="refreshQuotes()">↻ 更新</button></div><h1>我的投資</h1><div class="sub">台股＋美股複委託總覽</div><div class="hero"><div class="label">目前股票市值</div><div class="value">${money(m.value)}</div><div class="grid"><div class="metric"><span>投入成本</span><strong>${money(m.cost)}</strong></div><div class="metric"><span>未實現損益</span><strong class="${pc(m.pnl)}">${m.pnl>=0?'+':''}${money(m.pnl)} · ${m.pct.toFixed(2)}%</strong></div></div></div><div class="tabs"><button class="tab ${marketFilter==='ALL'?'active':''}" onclick="marketFilter='ALL';render()">全部</button><button class="tab ${marketFilter==='TW'?'active':''}" onclick="marketFilter='TW';render()">🇹🇼 台股</button><button class="tab ${marketFilter==='US'?'active':''}" onclick="marketFilter='US';render()">🇺🇸 美股</button></div><div class="section-title"><h2>持股</h2><small>${h.length} 個部位</small></div>${cards(h)}`}function renderHoldings(){$('#app').innerHTML=`<h1>持股</h1><div class="sub">紅色＝獲利，綠色＝虧損</div><div style="height:14px"></div>${cards(calc())}`}function renderActivity(){$('#app').innerHTML='<h1>交易紀錄</h1>'+state.transactions.map(t=>`<div class="card"><b>${t.symbol}</b><div class="name">${t.broker} · ${t.qty} × ${money(t.price,t.market==='TW'?'TWD':'USD')}</div></div>`).join('')}function renderSettings(){$('#app').innerHTML=`<h1>設定</h1><div class="card"><label>FinMind Token（台股）</label><input id="finmind" value="${state.settings.finmindToken||''}"><label>Twelve Data API Key（美股）</label><input id="twelve" value="${state.settings.twelveKey||''}"><label>USD/TWD</label><input id="fx" type="number" step=".001" value="${+state.settings.usdTwd||31.2}"><button class="primary" onclick="saveSettings()">儲存</button></div>`}function render(){$('.nav button.active')?.classList.remove('active');$(`.nav button[data-page="${page}"]`)?.classList.add('active');$('#fab').style.display=page==='settings'?'none':'block';({home:renderHome,holdings:renderHoldings,activity:renderActivity,settings:renderSettings}[page])()}function showTxSheet(){$('#sheetContent').innerHTML=`<h2>新增交易</h2><label>市場</label><select id="mkt"><option value="TW">台股</option><option value="US">美股</option></select><label>券商</label><select id="broker">${state.brokers.map(b=>`<option>${b}</option>`)}</select><label>代號</label><input id="symbol"><label>名稱</label><input id="name"><div class="formgrid"><div><label>股數</label><input id="qty" type="number"></div><div><label>成交價</label><input id="price" type="number"></div></div><label>交易匯率</label><input id="tfx" type="number" value="${+state.settings.usdTwd||31.2}"><button class="primary" onclick="addTx()">儲存</button><button class="secondary" onclick="$('#sheet').classList.remove('show')">取消</button>`;$('#sheet').classList.add('show')}function addTx(){const market=$('#mkt').value,symbol=$('#symbol').value.trim().toUpperCase(),broker=$('#broker').value,qty=+$('#qty').value,price=+$('#price').value;if(!symbol||!qty||!price)return alert('請填完整');state.transactions.push({id:String(Date.now()),market,type:'BUY',symbol,name:$('#name').value.trim(),broker,date:new Date().toISOString().slice(0,10),qty,price,fee:0,fx:market==='TW'?1:+$('#tfx').value});save();$('#sheet').classList.remove('show');render()}function saveSettings(){state.settings.finmindToken=$('#finmind').value.trim();state.settings.twelveKey=$('#twelve').value.trim();state.settings.usdTwd=+$('#fx').value||31.2;save();render()}async function refreshQuotes(){let ok=0,fail=0;for(const h of calc()){try{let p=0;if(h.market==='TW'){if(!state.settings.finmindToken)throw 0;const j=await(await fetch(`https://api.finmindtrade.com/api/v4/taiwan_stock_tick_snapshot?data_id=${h.symbol}&token=${state.settings.finmindToken}`)).json(),d=(j.data||[])[0]||{};p=+(d.close||d.price||d.last_price||0)}else{if(!state.settings.twelveKey)throw 0;const j=await(await fetch(`https://api.twelvedata.com/price?symbol=${h.symbol}&apikey=${state.settings.twelveKey}`)).json();p=+j.price||0}if(!p)throw 0;state.quotes[h.market+'|'+h.symbol]={price:p,updated:new Date().toISOString()};ok++}catch(e){fail++}}save();render();alert(`更新完成：${ok} 檔成功${fail?`，${fail} 檔失敗`:''}`)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#fab').onclick=showTxSheet;$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show')};render();</script></body></html>
